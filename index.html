<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Freidora</title>
<meta name="theme-color" content="#F7F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1814" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Freidora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: cocina de casa ordenada. Fondo arena tibio, verde albahaca como guía, azafrán para el calor de la freidora.
   Celular: barra inferior. Tablet/compu: menú lateral y grilla de recetas; la receta se abre en un panel. */
:root{
  --bg:#F7F1E8; --bg2:#EFE6D9; --surface:#FFFCF8; --ink:#2B241E; --muted:#776A5D; --line:#E6DACB;
  --basil:#3D6A47; --basil-ink:#FFFFFF; --basil-soft:#E3EDE2;
  --saffron:#D98E1F; --saffron-soft:#FBEBD0; --tomato:#C2452D; --tomato-soft:#F8E1DA;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1814; --bg2:#25201B; --surface:#29231D; --ink:#F2EADF; --muted:#B4A697; --line:#3B332B;
  --basil:#8DC59A; --basil-ink:#14261A; --basil-soft:#23362A; --saffron:#F0B256; --saffron-soft:#3D2D16;
  --tomato:#EE8A73; --tomato-soft:#43251E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1814; --bg2:#25201B; --surface:#29231D; --ink:#F2EADF; --muted:#B4A697; --line:#3B332B;
  --basil:#8DC59A; --basil-ink:#14261A; --basil-soft:#23362A; --saffron:#F0B256; --saffron-soft:#3D2D16;
  --tomato:#EE8A73; --tomato-soft:#43251E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---- estructura ---- */
.app{min-height:100%;display:flex}
.side{display:none}
.main{flex:1;min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.35rem}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--basil);display:grid;place-items:center}
.brand .logo svg{width:22px;height:22px;color:var(--basil-ink)}
.brand span b{color:var(--saffron)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:42px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.iconbtn svg{width:20px;height:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:.72rem;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--basil)}
.tab[aria-current="page"] svg{background:var(--basil-soft);border-radius:999px;padding:2px 14px;width:52px;box-sizing:content-box;margin:0 -14px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;width:240px;flex:none;padding:22px 14px;border-right:1px solid var(--line);background:var(--bg2)}
  .side .brand{padding:0 8px 18px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.98rem;padding:11px 12px;color:var(--ink)}
  .side .tab[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow);color:var(--basil)}
  .side .tab[aria-current="page"] svg{background:none;padding:0;width:24px;margin:0}
  .side .spacer{flex:1}
  nav.tabs{display:none}
  .topbar .brand{display:none}
  .topbar{justify-content:flex-end;margin-bottom:12px}
  .wrap{padding-block:28px 48px;padding-left:36px;padding-right:36px}
}

/* ---- piezas ---- */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
.h1{font-size:clamp(1.7rem,4.6vw,2.4rem);font-weight:800}
.h2{font-size:1.3rem;font-weight:800}
.section{margin-top:28px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.link{border:0;background:none;color:var(--basil);font-weight:700;padding:4px 0}
.search{position:relative}
.search input{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px 0 48px;font-size:1.02rem;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--basil)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapit{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
.chip .c{opacity:.7;font-weight:500;margin-left:4px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--basil);color:var(--basil-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.heat{background:var(--saffron);color:#24170A}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:.88rem}
.btn[disabled]{opacity:.55}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qa .ic svg{width:22px;height:22px}
.qa b{font-size:.95rem;line-height:1.2}
.qa span{font-size:.8rem;color:var(--muted);line-height:1.25}
@media (max-width:420px){.qa{padding:12px 10px}.qa span{display:none}}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;min-width:0}
@media (min-width:900px){.cats{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.cat{flex-direction:row;align-items:center;gap:12px}}
.cat .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center}
.cat .ic svg{width:22px;height:22px}
.cat b{display:block;font-size:.95rem;line-height:1.2}
.cat small{color:var(--muted);font-size:.8rem}

.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 12px 14px;display:flex;gap:12px;text-align:left;min-width:0;box-shadow:var(--shadow);transition:transform .12s ease;cursor:pointer}
.card:active{transform:scale(.99)}
.card .ic{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center}
.card .ic svg{width:24px;height:24px}
.card .body{min-width:0;flex:1}
.card .t{font-weight:700;font-size:1rem;line-height:1.25;padding-right:30px}
.card .m{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;color:var(--muted);font-size:.82rem}
.card .m span{display:inline-flex;align-items:center;gap:4px}
.card .m svg{width:15px;height:15px}
.card .extra{margin-top:6px;font-size:.82rem;font-weight:600}
.have{color:var(--basil)} .miss{color:var(--muted)}
.fav{position:absolute;top:8px;right:8px;border:0;background:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.fav svg{width:22px;height:22px}
.fav[aria-pressed="true"]{color:var(--tomato)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,80%);gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
@media (min-width:900px){.hscroll{grid-auto-columns:minmax(260px,32%)}}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.15rem;margin-bottom:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--saffron-soft);border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:.92rem}
.hero{background:linear-gradient(135deg,var(--basil-soft),transparent 70%);border-radius:22px;padding:20px 18px;margin:0 -2px}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:var(--shadow);margin-top:18px}
.welcome ol{padding-left:20px;color:var(--muted)}

/* viandas */
.week{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.week{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1180px){.week{grid-template-columns:repeat(3,1fr)}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.day.today{border-color:var(--basil);box-shadow:0 0 0 2px var(--basil-soft),var(--shadow)}
.day h3{font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-family:var(--body);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--basil-soft);color:var(--basil);display:inline-block}
.pill.s{background:var(--saffron-soft);color:var(--saffron)}
.slot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.slot .nm{border:0;background:none;text-align:left;padding:0;min-width:0}
.slot .nm b{display:block;font-weight:700;line-height:1.25;margin-top:6px}
.slot .nm small{color:var(--muted)}
.swap{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.swap svg{width:15px;height:15px}
.note{background:var(--basil-soft);border-radius:var(--r);padding:14px 16px;font-size:.92rem;margin-top:16px}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.shop label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.shop label:last-child{border-bottom:0}
.shop input{margin-top:3px;width:20px;height:20px;accent-color:var(--basil);flex:none}
.shop .done{text-decoration:line-through;color:var(--muted)}

/* heladera */
.group{margin-top:14px}
.group .eyebrow{margin-bottom:8px}

/* ficha */
.sheet{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.sheet .scrim{position:absolute;inset:0;background:rgba(20,12,4,.45)}
.sheet .panel{position:relative;width:100%;height:100%;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease}
@media (min-width:900px){.sheet .panel{width:min(720px,92vw);border-radius:22px 0 0 22px;padding:20px 36px 48px;animation:left .22s ease}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes left{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center}
.sheet .ic svg{width:22px;height:22px}
.sheetbar{position:sticky;top:calc(-8px - env(safe-area-inset-top,0px));z-index:2;display:flex;justify-content:space-between;align-items:center;padding:8px 0;background:var(--bg);margin-bottom:6px}
.back{border:0;background:none;font-weight:700;color:var(--basil);padding:8px 0;display:inline-flex;align-items:center;gap:4px}
.back svg{width:22px;height:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.45rem;color:var(--saffron);line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:.76rem;color:var(--muted)}
.stat.off b{color:var(--muted);font-size:1.05rem}
.ing{list-style:none;padding:0;margin:8px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ing li{border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.ing label{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;cursor:pointer}
.ing input{width:20px;height:20px;margin-top:2px;accent-color:var(--basil);flex:none}
.ing input:checked+span{color:var(--muted);text-decoration:line-through}
.ing .sub{font-weight:700;padding:10px 14px 4px;color:var(--muted);font-size:.85rem}
.steps{list-style:none;padding:0;margin:8px 0 0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--basil-soft);color:var(--basil);font-weight:800;font-size:.9rem}
.steps li.done{color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--basil);color:var(--basil-ink)}
.box{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.94rem}
.box.tip{background:var(--saffron-soft)}
.box.warn{background:var(--tomato-soft)}
.box b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.meta-line{color:var(--muted);font-size:.85rem;margin-top:14px}

/* libros */
.book{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.book .bt{min-width:0}
.book b{display:block;line-height:1.25}
.book small{color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--saffron);width:0;transition:width .3s}

/* temporizador */
.timer{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.ring{width:min(70vw,300px);aspect-ratio:1;max-width:100%;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(2.6rem,12vw,3.8rem);font-weight:800}
.alert{background:var(--saffron);color:#24170A;font-weight:800;border-radius:14px;padding:12px 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Menú">
    <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="4"/><rect x="8" y="11" width="8" height="6" rx="1.5"/><circle cx="12" cy="7" r="1.4" fill="currentColor"/></svg></div><span>Mi <b>Freidora</b></span></div>
    <div id="sidetabs"></div>
    <div class="spacer"></div>
    <button class="tab" data-libros><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>Mis libros</button>
  </aside>
  <div class="main">
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="4"/><rect x="8" y="11" width="8" height="6" rx="1.5"/><circle cx="12" cy="7" r="1.4" fill="currentColor"/></svg></div><span>Mi <b>Freidora</b></span></div>
        <button class="iconbtn" data-libros aria-label="Mis libros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg><span id="libcount">Libros</span></button>
      </div>
      <main id="view"></main>
    </div>
  </div>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="bottomtabs"></div></nav>
<div class="sheet" id="sheet" hidden><div class="scrim" data-close></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="timer" id="timer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>
<script>
/* ===== Lector de recetas v3 =====
   1) separa cada receta por su bloque "Ingredientes"
   2) junta todos los títulos candidatos
   3) asigna cada título a la receta cuyos ingredientes y pasos coinciden con él
      (y si no hay coincidencia clara, por número y posición) */
const PARSER_VERSION=4;

/* ============ clasificación ============ */
function classify(r){
  const n=NORM(r.n),ing=NORM(r.i.join(" ")),ch=NORM(r.ch||""),all=n+" "+ing;
  const has=(re,x=all)=>re.test(x);
  const FISH=/merluza|pescad|atun|salmon|brotola|calamar|langostin|marisco|lenguado|sardina|corvina|trucha|dorada|caballa|bacalao|gamba|camaron|mejillon|pulpo|abadejo|tilapia|lubina/;
  const CHICK=/pollo|pechuga|suprema|muslo|pavo|alita/;
  const MEAT=/carne|bife|cerdo|bondiola|matambre|asado|lomo|cuadril|nalga|costilla|ternera|chorizo|milanesa(?! de (pollo|berenjena|soja|pescado))/;
  const SWEET=/postre|pastelito|brownie|bizcoch|torta|tarta de (manzana|pina|fresa|frutilla|limon|queso|chocolate|pera)|flan|coulant|crumble|cheesecake|pastel de (queso|zanahoria|chocolate|platano|banana|manzana)|galleta|cookie|alfajor|dona|budin|magdalena|muffin|cupcake|rollitos? (dulce|de canela)|helado|mousse|churro|trufa|bombon|barrita|macaron|tiramisu|compota|manzanas? asada/;
  const BREAK=/desayuno|merienda/;
  let c;
  if(has(/batido|smoothie|licuado|jugo|zumo|limonada|agua de|bebida|detox|infusion|te helado/,n)&&!r.fryer)c="Bebidas y batidos";
  else if(has(/^(salsa|dip|aderezo|mayonesa|vinagreta|hummus|guacamole|chimichurri|pesto|pate|untable|crema de (ajo|palta|aguacate)|pasta de (huevo|atun|garbanzo|aceituna|mani|sesamo|berenjena|queso|palta|aguacate|zanahoria|morron))\b/,n))c="Salsas y untables";
  else if(has(SWEET,n))c=has(BREAK,ch)&&!has(/brownie|coulant|flan|cheesecake|tiramisu|helado|mousse/,n)?"Desayunos y meriendas":"Dulces y postres";
  else if(has(BREAK,ch)&&!has(FISH,n)&&!has(CHICK,n)&&!has(MEAT,n)||has(/tostada|avena|granola|pancake|panqueque|tortita|waffle|gofre|yogur|medialuna|scone|croissant|porridge|bagel/,n)&&!has(FISH,n)&&!has(CHICK,n))c="Desayunos y meriendas";
  else if(has(FISH,n))c="Pescados y mariscos";
  else if(has(CHICK,n))c="Pollo y pavo";
  else if(has(MEAT,n))c="Carnes";
  else if(has(/pasta|fideo|noqui|ravio|canelon|lasan|sorrentino|pizza|pizzeta|empanad|tarta|quiche|calzone|wrap|taco|burrito|fajita|sandwich|bocadillo|panini|pan\b|pan de|focaccia|fugazza|chipa|pastel de papa/,n))c="Pastas, pizzas y masas";
  else if(has(/huevo|tortilla(?! integral| de trigo| mexicana)|omelette|revuelto|frittata|clara/,n))c="Huevos";
  else if(has(/garbanzo|lenteja|poroto|alubia|frijol|falafel|soja|tofu|seitan|quinoa|hummus/,n))c="Legumbres y veggie";
  else if(has(/chips|nacho|baston|palito|bocadito|croqueta|aros? de|papas fritas|fries|bolita|snack|nugget|tequeno|picada|aperitivo/,n))c="Snacks y aperitivos";
  else if(has(FISH,ing))c="Pescados y mariscos";
  else if(has(CHICK,ing))c="Pollo y pavo";
  else if(has(MEAT,ing))c="Carnes";
  else if(has(/huevo/,ing)&&r.i.length<=5&&!has(/harina|avena|polvo de hornear|levadura/,ing))c="Huevos";
  else c="Verduras y guarniciones";
  r.c=c;
  const spicy=/picante|habanero|sriracha|chile|jalapeno|aji molido|cayena/.test(all);
  const alcohol=/vino|cerveza|whisky|licor|\bron\b|vodka/.test(all);
  const sugary=/azucar(?! moreno| de cana| mascabo)|caramelo|crema batida|dulce de leche|nutella|helado|chantilly|leche condensada/.test(all);
  const okTime=!r.m||r.m<=35;
  r.v="";
  if(!spicy&&!alcohol&&r.fryer&&okTime&&r.i.length>=2){
    if(["Pollo y pavo","Pescados y mariscos","Carnes","Huevos","Legumbres y veggie","Pastas, pizzas y masas"].includes(c))r.v="m";
    else if(c==="Verduras y guarniciones"&&/queso|ricota|ricotta|huevo|atun|jamon|pollo|garbanzo|lenteja/.test(ing))r.v="m";
    else if((c==="Desayunos y meriendas"||c==="Snacks y aperitivos"||c==="Dulces y postres")&&!sugary&&/avena|banana|platano|manzana|zanahoria|yogur|pera|calabaza|frutos|arandano|nuez|almendra|integral|queso|huevo|batata|boniato/.test(ing)&&!/brownie|coulant|flan|cheesecake|churro/.test(n))r.v="s";
  }
  return r;
}

/* ============ nombres de libros claros ============ */
function bookName(raw){
  let x=String(raw||"").replace(/\.pdf$/i,"").replace(/^[a-z]_/i,"").replace(/[_]+/g," ").replace(/\s*\(\d+\)\s*$/,"");
  x=x.replace(/\s*\+\s*bonus\b/i,"").replace(/\bbonus regalo\b/i,"").replace(/\bregalo\b/i,"").replace(/#\s*(\d+)/g,"$1");
  x=x.replace(/(\w)-(?=\w)/g,"$1 ");
  const ROM={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12};
  let parte="";x=x.replace(/\bparte\s+([IVX]+|\d+)\b\s*[-–:.]?\s*/i,(m,n)=>{parte=" · Parte "+(ROM[n.toUpperCase()]||n);return "";});
  x=x.replace(/[.,;:]?\s*para (tu |la )?freidora( de aire)?\s*$/i,"").replace(/[.\s\-–]+$/,"").replace(/\s+/g," ").trim();
  const L=(x.match(/\p{L}/gu)||[]);const upper=L.length&&L.filter(c=>c===c.toUpperCase()).length/L.length>0.7;
  if(upper){const small=new Set(["de","del","y","e","para","con","en","la","el","los","las","sin","pero","es","a","al","o","por"]);
    x=x.toLowerCase().split(" ").map((w,i)=>i>0&&small.has(w)?w:(/^(airfryer|uruguay|uruguayas?)$/.test(w)?w[0].toUpperCase()+w.slice(1):w[0]?w[0].toUpperCase()+w.slice(1):w)).join(" ");}
  else x=x.charAt(0).toUpperCase()+x.slice(1);
  x=x.replace(/\bazucar\b/gi,m=>m[0]==="A"?"Azúcar":"azúcar").replace(/\bninos\b/gi,m=>m[0]==="N"?"Niños":"niños");
  return (x||"Libro sin nombre")+parte;
}

const slug=x=>NORM(x).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48);
function rebuild(){
  const all=[];const seen=new Map();
  const nameOf=Object.fromEntries(BOOKS.map(b=>[b.id,b.t]));
  Object.entries(IMPORTED).forEach(([fid,list])=>list.forEach(r=>{
    if(nameOf[fid])r.b=nameOf[fid];
    classify(r);
    const key=slug(r.n)+"|"+slug((r.i[0]||"")).slice(0,16);
    const prev=seen.get(key);
    if(prev){if((r.i.length+r.s.length)>(prev.i.length+prev.s.length)){all[all.indexOf(prev)]=r;seen.set(key,r);}return;}
    seen.set(key,r);all.push(r);
  }));
  const used=new Set();all.forEach(r=>{const base=(r.fid||"x").slice(-5)+"-"+slug(r.n);let id=base,k=2;while(used.has(id))id=base+"-"+(k++);used.add(id);r.id=id;
    if(!r.tags){const txt=NORM(r.i.join(" "));r.tags=ING.filter(([,re])=>re.test(txt)).map(([k])=>k);}});
  R=all.sort((a,b)=>a.n.localeCompare(b.n,"es"));BYID=Object.fromEntries(R.map(r=>[r.id,r]));
  if(S.week&&S.week.some(x=>!BYID[x.m]||!BYID[x.s]))S.week=null;
  const lc=$("#libcount");if(lc)lc.textContent=R.length?fmtN(R.length)+" recetas":"Libros";
}

function dailyPick(list,n){const seed=Math.floor(Date.now()/864e5);const out=[];if(!list.length)return out;let x=seed;const used=new Set();
  for(let k=0;k<Math.min(n,list.length);k++){x=(x*9301+49297)%233280;let i=x%list.length;while(used.has(i))i=(i+1)%list.length;used.add(i);out.push(list[i]);}return out;}

const IDB={db:null,open(){return this.db?Promise.resolve(this.db):new Promise((ok,ko)=>{const rq=indexedDB.open("mi-freidora",2);
  rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains("libros"))d.createObjectStore("libros",{keyPath:"fileId"});if(!d.objectStoreNames.contains("ocr"))d.createObjectStore("ocr",{keyPath:"key"});};
  rq.onsuccess=()=>{this.db=rq.result;ok(this.db)};rq.onerror=()=>ko(rq.error);});},
  async tx(st,mode,fn){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction(st,mode);const r=fn(t.objectStore(st));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error);});},
  put(v){return this.tx("libros","readwrite",s=>s.put(v))},del(k){return this.tx("libros","readwrite",s=>s.delete(k))},all(){return this.tx("libros","readonly",s=>s.getAll())},
  ocrGet(k){return this.tx("ocr","readonly",s=>s.get(k)).catch(()=>null)},ocrPut(v){return this.tx("ocr","readwrite",s=>s.put(v)).catch(()=>{})},ocrDel(k){return this.tx("ocr","readwrite",s=>s.delete(k)).catch(()=>{})}};

/* lee el texto de una página en orden visual (arriba→abajo, y por columnas) */
function pageText(tc,W){
  const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,h:Math.abs(it.transform[3])||it.height||10}));
  items.sort((a,b)=>b.y-a.y||a.x-b.x);
  const rows=[];
  for(const it of items){const row=rows.length?rows[rows.length-1]:null;if(row&&Math.abs(row.y-it.y)<=Math.max(2.5,it.h*0.45)){row.items.push(it);}else rows.push({y:it.y,items:[it]});}
  const segs=[];
  rows.forEach(row=>{row.items.sort((a,b)=>a.x-b.x);let cur=null;
    for(const it of row.items){const gap=cur?it.x-cur.x1:0;
      if(cur&&gap>Math.max(it.h*2.5,W*0.06)){segs.push(cur);cur=null;}
      if(!cur)cur={y:row.y,x0:it.x,x1:it.x+it.w,t:it.s};else{cur.t+=(gap>it.h*0.15&&!/\s$/.test(cur.t)&&!/^\s/.test(it.s)?" ":"")+it.s;cur.x1=it.x+it.w;}}
    if(cur)segs.push(cur);});
  const out=[];let L=[],Rr=[];const mid=W/2;
  const flush=()=>{out.push(...L.map(s=>s.t),...Rr.map(s=>s.t));L=[];Rr=[];};
  segs.forEach(s=>{const full=s.x0<mid*0.9&&s.x1>mid*1.1;if(full){flush();out.push(s.t);}else if(s.x0<mid)L.push(s);else Rr.push(s);});
  flush();
  return out.map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
}
let OCRW=null,WAKE=null;
function loadScript(src){return new Promise((ok,ko)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=()=>ko(new Error("No se pudo descargar el lector de imágenes. Revisá la conexión a internet."));document.head.appendChild(el);});}
async function ocrWorker(){if(OCRW)return OCRW;if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");OCRW=await Tesseract.createWorker("spa");return OCRW;}
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!WAKE)WAKE=await navigator.wakeLock.request("screen");if(!on&&WAKE){await WAKE.release();WAKE=null;}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&BUSY){WAKE=null;keepAwake(true);}});
const goodOcr=t=>{t=t.replace(/\s+/g," ").trim();if(t.length<2)return false;const n=(t.match(/[\p{L}\p{N}]/gu)||[]).length;return n/t.length>=0.55;};
async function ocrPage(page){
  const v1=page.getViewport({scale:1});const sc=Math.min(2.5,1700/v1.width);const vp=page.getViewport({scale:sc});
  const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;const w=await ocrWorker();const {data}=await w.recognize(c);c.width=c.height=0;
  const ls=(data.lines&&data.lines.length)?data.lines.filter(l=>l.confidence==null||l.confidence>=45).map(l=>l.text):String(data.text||"").split("\n");
  return ls.map(x=>x.replace(/\s+/g," ").trim()).filter(goodOcr);
}
async function pdfLines(bytes,onp,key){
  if(!window.pdfjsLib)throw new Error("No se pudo cargar el lector de PDF. Revisá la conexión a internet y volvé a abrir la app.");
  const doc=await pdfjsLib.getDocument({data:bytes}).promise;const lines=[];
  const saved=key?await IDB.ocrGet(key):null;const po=(saved&&saved.pages)||{};let ocrN=0;
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);const W=page.getViewport({scale:1}).width;const tc=await page.getTextContent();
    let pl=pageText(tc,W);lines.push("§PAGE "+p);
    if(pl.join("").replace(/\s/g,"").length<60){
      if(po[p]){pl=po[p];onp(p,doc.numPages,"ocr-cached");}
      else{onp(p,doc.numPages,"ocr");await keepAwake(true);pl=await ocrPage(page);po[p]=pl;if(key)await IDB.ocrPut({key,pages:po});}
      ocrN++;

}
function finish(fileId,title,lines){const recs=parseBook(lines,title,fileId);recs.forEach(r=>{r.fid=fileId;classify(r);});return recs;}
async function importBytes(fileId,title,bytes,mb){
  BUSY=true;const key=fileId+"|"+bytes.length;const t0=Date.now();let ocrDone=0;

  try{out=await pdfLines(bytes,(p,n,mode)=>{
      const pct=Math.round(p/n*100);
      if(mode==="ocr"){ocrDone++;const per=(Date.now()-t0)/ocrDone;const left=Math.max(1,Math.round(per*(n-p)/60000));ST[fileId]={state:"busy",pct,msg:`Leyendo imágenes: página ${p} de ${n} · faltan unos ${left} min. Dejá la app abierta.`};renderLibros();}
      else{ST[fileId]={state:"busy",pct,msg:`Leyendo página ${p} de ${n}`};if(p%4===0||p===n)renderLibros();}
    },key);}
  catch(e){await keepAwake(false);BUSY=false;ST[fileId]={state:"err",msg:(e&&e.message)||"No se pudo leer este PDF."};renderLibros();return;}
  await keepAwake(false);

  if(!recs.length){BUSY=false;ST[fileId]={state:"err",msg:out.ocrN?"Leí las páginas pero no encontré recetas (no aparece la palabra «Ingredientes»).":"No encontré recetas en este PDF (no aparece la palabra «Ingredientes»)."};renderLibros();return;}
  IMPORTED[fileId]=recs;NEEDS_RELOAD=NEEDS_RELOAD.filter(t=>t!==title);rebuild();

    ST[fileId]={state:"ok",n:recs.length};}

  BUSY=false;renderLibros();render();toast(`${fmtN(recs.length)} recetas de «${title}»`);
}
function renderLibros(){
  if(S.sheet!=="libros")return;
  const total=Object.values(IMPORTED).reduce((a,x)=>a+x.length,0);
  const row=b=>{const st=ST[b.id]||{};
    if(S.renaming===b.id)return `<div class="book"><form class="bt rename" data-rename="${esc(b.id)}" style="flex:1;display:flex;gap:8px"><input id="rn" value="${esc(b.t)}" aria-label="Nombre del libro" maxlength="60" style="flex:1;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--basil);background:var(--bg);padding:0 10px"><button class="btn sm" type="submit">Guardar</button></form></div>`;
    return `<div class="book"><div class="bt" style="flex:1">
      <b>${esc(b.t)}</b>${b.file&&bookName(b.file)!==b.file?`<small style="display:block">Archivo: ${esc(b.file)}</small>`:""}<small>${st.state==="ok"?`<span class="have">${fmtN(st.n)} recetas</span>${st.reload?` · <span style="color:var(--tomato)">volvé a cargarlo para corregir títulos</span>`:""}${st.msg?` · ${esc(st.msg)}`:""}`:st.state==="busy"?esc(st.msg):st.state==="err"?`<span style="color:var(--tomato)">${esc(st.msg)}</span>`:""}${b.mb?` · ${b.mb} MB`:""}</small>
      ${st.state==="busy"?`<div class="bar"><i style="width:${st.pct||2}%"></i></div>`:""}</div>
      ${st.state==="ok"||st.state==="err"?`<div style="display:flex;flex-direction:column;gap:6px">${st.state==="ok"?`<button class="btn ghost sm" data-renamebook="${esc(b.id)}">Renombrar</button>`:""}<button class="btn ghost sm" data-delbook="${esc(b.id)}">Quitar</button></div>`:""}</div>`;};
  $("#panel").innerHTML=`<div class="sheetbar"><button class="back" data-close>${IC.back}Volver</button></div>
    <h1 class="h1">Mis libros</h1>
    <p class="lead">Elegí los PDF de recetas: en el selector del teléfono podés entrar a Google Drive o a Descargas. La app lee cada libro completo, ordena título, ingredientes y pasos, y comprueba que el título coincida con la receta. Todo queda guardado en este celular y funciona sin internet.</p>
    <label class="btn" for="pick" style="margin-top:16px;width:100%">${IC.plus}Agregar libros (PDF)</label>
    <input type="file" id="pick" accept="application/pdf" multiple hidden>
    <p class="eyebrow num" style="margin:18px 0 10px">${total?`${fmtN(R.length)} recetas únicas de ${BOOKS.length} ${BOOKS.length===1?"libro":"libros"}`:"Todavía no cargaste ningún libro"}</p>
    <div style="display:grid;gap:8px">${BOOKS.map(row).join("")}</div>
    <div class="section"><h2 class="h2">Copia de respaldo</h2>
      <p class="lead">Guardá todas tus recetas, favoritas y la semana de viandas en un archivo (por ejemplo en tu Google Drive). En otro celular, tocá «Cargar copia», elegí ese archivo y aparece todo en segundos, sin volver a leer los libros.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" data-backup ${R.length?"":"disabled"}>Guardar copia</button><label class="btn ghost" for="restore">Cargar copia</label></div>
      <input type="file" id="restore" accept=".json,application/json" hidden>
      ${S.lastBackup?`<p class="meta-line">Última copia: ${esc(S.lastBackup)}</p>`:""}
    </div>
    <p class="meta-line" style="margin-top:18px">Los libros escaneados o hechos con imágenes también se pueden cargar: la app lee el texto de cada página (tarda unos segundos por página y la primera vez necesita internet). Si se corta, elegí el mismo PDF otra vez y sigue donde quedó.</p>`;
}
function openLibros(){S.sheet="libros";$("#sheet").hidden=false;renderLibros();$("#panel").scrollTop=0;if(!(history.state&&history.state.sheet))history.pushState({sheet:1},"","#libros");}
async function loadSaved(){
  try{const rows=await IDB.all()||[];
    for(const x of rows){
      let recs=x.recipes||[];let reload=false;
      if(x.lines&&x.pv!==PARSER_VERSION){recs=finish(x.fileId,x.title,x.lines);IDB.put({...x,pv:PARSER_VERSION,recipes:recs}).catch(()=>{});}
      else if(!x.lines){reload=true;recs.forEach(r=>{r.ch=r.ch||r.c||"";r.fryer=r.fryer??!!r.t;r.warn=r.warn||"";r.nut=r.nut||"";r.i=r.i||[];r.s=r.s||[];});}
      recs.forEach(r=>{r.fid=r.fid||x.fileId;r.tags=null;});
      IMPORTED[x.fileId]=recs;ST[x.fileId]={state:"ok",n:recs.length,reload};
      if(reload)NEEDS_RELOAD.push(x.name||bookName(x.title));
      const nm=x.name||bookName(x.title);recs.forEach(r=>r.b=nm);
      if(!BOOKS.some(b=>b.id===x.fileId))BOOKS.push({id:x.fileId,t:nm,file:x.file||x.title,mb:x.mb});
    }
    rebuild();render();renderLibros();
  }catch(e){toast("No se pudieron leer los libros guardados en este celular.");render();}
}

/* ============ copia de respaldo ============ */
async function makeBackup(){
  const rows=await IDB.all();
  const data={app:"mi-freidora",version:1,fecha:new Date().toISOString(),libros:rows.map(x=>({...x,name:(BOOKS.find(b=>b.id===x.fileId)||{}).t||x.name})),favs:S.favs,week:S.week,have:S.have,shop:S.shop};
  const d=new Date();const fname=`mi-freidora-copia-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  const file=new File([JSON.stringify(data)],fname,{type:"application/json"});
  S.lastBackup=`${d.toLocaleDateString("es-UY")} · ${rows.length} ${rows.length===1?"libro":"libros"} · ${fmtN(R.length)} recetas`;store.set("lastBackup",S.lastBackup);
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Copia de Mi Freidora",text:"Copia de respaldo de mis recetas"});toast("Copia lista. Si elegiste Drive, ya quedó guardada.");renderLibros();return;}}
  catch(e){if(e&&e.name==="AbortError"){toast("No se guardó la copia");return;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  toast("Copia descargada en el celular (carpeta Descargas)");renderLibros();
}
async function restoreBackup(f){
  let data;try{data=JSON.parse(await f.text());}catch(e){toast("Ese archivo no es una copia de Mi Freidora");return;}
  if(!data||data.app!=="mi-freidora"||!Array.isArray(data.libros)){toast("Ese archivo no es una copia de Mi Freidora");return;}
  let n=0;
  for(const x of data.libros){if(!x||!x.fileId)continue;await IDB.put(x).catch(()=>{});n++;}
  if(Array.isArray(data.favs)){S.favs=[...new Set([...S.favs,...data.favs])];store.set("favs",S.favs);}
  if(data.week&&!S.week){S.week=data.week;store.set("week",S.week);}
  if(Array.isArray(data.have)&&!S.have.length){S.have=data.have;store.set("have",S.have);}
  IMPORTED={};BOOKS=[];ST={};NEEDS_RELOAD=[];await loadSaved();
  toast(`Listo: ${n} ${n===1?"libro":"libros"} y ${fmtN(R.length)} recetas cargadas`);
}
async function renameBook(id,name){
  name=String(name||"").replace(/\s+/g," ").trim().slice(0,60);S.renaming=null;
  const b=BOOKS.find(x=>x.id===id);if(!b||!name){renderLibros();return;}
  b.t=name;(IMPORTED[id]||[]).forEach(r=>r.b=name);
  try{const rows=await IDB.all();const x=rows.find(r=>r.fileId===id);if(x)await IDB.put({...x,name});}catch(e){}
  rebuild();renderLibros();toast("Nombre guardado");
}

/* ============ temporizador ============ */
let T=null,actx=null;
function beep(n=3){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.35;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);}}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function startTimer(id){
  const r=BYID[id];const total=r.m*60;let left=total,half=false;const end=Date.now()+total*1000;beep(1);keepAwake(true);
  const el=$("#timer");el.hidden=false;history.pushState({sheet:1,timer:1},"","#temporizador");const C=2*Math.PI*45;
  const draw=(msg="")=>{const mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
    el.innerHTML=`<p class="eyebrow">${esc(r.n)}${r.t?` · ${r.t} °C`:""}</p>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="50" cy="50" r="45" fill="none" stroke="var(--saffron)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-left/total)}"/></svg><div class="n num">${mm}:${ss}</div></div>
    ${msg?`<div class="alert">${msg}</div>`:`<p class="lead" style="margin:0">${r.flip?"Te aviso a la mitad para dar vuelta.":"Dejá la pantalla abierta: suena al terminar."}</p>`}
    <button class="btn ghost" data-stop>${left?"Cancelar":"Listo"}</button>`;};
  draw();clearInterval(T);
  T=setInterval(()=>{left=Math.max(0,Math.round((end-Date.now())/1000));
    if(r.flip&&!half&&left<=Math.floor(total/2)){half=true;beep(2);}
    if(left<=0){clearInterval(T);beep(4);draw("¡Listo! Sacalo de la freidora");return;}
    draw(r.flip&&half&&left>total/2-20?"Dar vuelta o agitar la canasta":"");},500);
}
function stopTimer(){clearInterval(T);$("#timer").hidden=true;keepAwake(false);if(history.state&&history.state.timer){skipPop=true;history.back();}}

/* ============ render y eventos ============ */
function render(){
  renderTabs();
  $("#view").innerHTML=({inicio:vInicio,recetas:vRecetas,heladera:vHeladera,viandas:vViandas,favoritas:vFavoritas})[S.tab]();
}
function go(tab){S.tab=tab;S.limit=36;render();scrollTo({top:0});if(location.hash!=="#"+tab)history.replaceState(history.state,"","#"+tab);}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-fav],[data-open],[data-tab],[data-cat],[data-flag],[data-have],[data-clear],[data-newweek],[data-swap],[data-close],[data-timer],[data-stop],[data-libros],[data-delbook],[data-more],[data-quick],[data-backup],[data-renamebook],.steps li");
  if(!t)return;const d=t.dataset;
  if(t.matches(".steps li")){t.classList.toggle("done");return;}
  if(d.fav){e.stopPropagation();const id=d.fav;S.favs=isFav(id)?S.favs.filter(x=>x!==id):[...S.favs,id];store.set("favs",S.favs);
    document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b=>{b.setAttribute("aria-pressed",isFav(id));b.setAttribute("aria-label",isFav(id)?"Quitar de favoritas":"Guardar en favoritas");});
    toast(isFav(id)?"Guardada en favoritas":"Quitada de favoritas");if(S.tab==="favoritas"&&!S.sheet)render();return;}
  if(d.open){openRecipe(d.open);return;}
  if(d.tab){if(!$("#sheet").hidden)closeSheet();go(d.tab);return;}
  if(d.cat!==undefined){S.cat=d.cat||null;S.limit=36;if(S.tab!=="recetas")go("recetas");else render();return;}
  if(d.quick==="rapidas"){S.fq=true;S.cat=null;go("recetas");return;}
  if(d.flag){S[d.flag]=!S[d.flag];S.limit=36;render();return;}
  if(d.have){const k=d.have;S.have=S.have.includes(k)?S.have.filter(x=>x!==k):[...S.have,k];store.set("have",S.have);S.limit=36;const y=scrollY;render();scrollTo({top:y});return;}
  if("clear" in d){S.have=[];store.set("have",[]);render();return;}
  if("newweek" in d){buildWeek();render();toast("Semana nueva armada");return;}
  if(d.swap){const[x,s]=d.swap.split("|");swap(+x,s);const y=scrollY;render();scrollTo({top:y});return;}
  if("close" in d){closeSheet();return;}
  if(d.timer){startTimer(d.timer);return;}
  if("stop" in d){stopTimer();return;}
  if("libros" in d){openLibros();return;}
  if("backup" in d){makeBackup();return;}
  if(d.renamebook){S.renaming=d.renamebook;renderLibros();setTimeout(()=>{const i=$("#rn");if(i){i.focus();i.select();}},0);return;}
  if(d.delbook){const id=d.delbook;IDB.del(id).catch(()=>{});const b=BOOKS.find(x=>x.id===id);delete IMPORTED[id];delete ST[id];BOOKS=BOOKS.filter(x=>x.id!==id);if(b)NEEDS_RELOAD=NEEDS_RELOAD.filter(t=>t!==b.t);rebuild();renderLibros();return;}
  if("more" in d){S.limit+=36;if(S.tab==="recetas")$("#rlist").innerHTML=listHTML();else{const y=scrollY;render();scrollTo({top:y});}return;}
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".card")){e.preventDefault();openRecipe(e.target.dataset.open);return;}
  if(e.key==="Escape"){if(!$("#timer").hidden)stopTimer();else closeSheet();return;}
  if(e.key==="Enter"&&e.target.id==="homeq"){S.q=e.target.value;S.cat=null;go("recetas");setTimeout(()=>{const i=$("#q");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},0);}
});
let qT=null;
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S.limit=36;clearTimeout(qT);qT=setTimeout(()=>{$("#rlist").innerHTML=listHTML();},120);}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-rename]");if(f){e.preventDefault();renameBook(f.dataset.rename,$("#rn").value);}});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="restore"){const f=el.files[0];el.value="";if(f)restoreBackup(f);return;}
  if(el.dataset&&el.dataset.shop!==undefined){const k=el.dataset.shop;if(el.checked)S.shop[k]=1;else delete S.shop[k];store.set("shop",S.shop);el.nextElementSibling.className=el.checked?"done":"";return;}
  if(el.id==="pick"){const files=[...el.files];el.value="";
    for(const f of files){const id="local-"+NORM(f.name).replace(/[^a-z0-9]+/g," ").trim().replace(/ /g,"-").slice(0,60);const prev=BOOKS.find(b=>b.id===id);const title=prev?prev.t:bookName(f.name);const mb=+(f.size/1048576).toFixed(1);
      if(!prev)BOOKS.push({id,t:title,file:f.name,mb});
      try{await importBytes(id,title,new Uint8Array(await f.arrayBuffer()),mb);}catch(err){BUSY=false;ST[id]={state:"err",msg:"No se pudo leer este PDF."};renderLibros();}}
  }
});
const h0=location.hash.slice(1);if(TABS.some(t=>t[0]===h0))S.tab=h0;else if(h0)history.replaceState(null,"","#"+S.tab);
render();loadSaved();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
